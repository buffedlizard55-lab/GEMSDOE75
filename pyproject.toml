[project]
name = "gems-doe-fault-discovery"
version = "0.1.0"
description = "Auditable research + submission pipeline for the DOE GEMS Prize Challenge (DrivenData #306)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
