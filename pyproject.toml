[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems-doe-fault-discovery"
version = "0.2.0"
description = "Auditable research, zero-leakage holdout validation, and portal-safe GeoTIFF submission pipeline for the DOE GEMS Prize Challenge (DrivenData #306)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "matplotlib>=3.7",
    "Markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vendor", "."]

[tool.setuptools.packages.find]
where = ["src"]
